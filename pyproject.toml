[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qualtrics-analysis"
version = "0.1.0"
description = "Qualtrics survey export and analysis pipeline"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "QualtricsAPI>=0.2",
]

[project.scripts]
qualtrics = "qualtrics_pipeline.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "black>=24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's *default* selection is not stable across
# releases -- 0.16 widened it well beyond the historical E4/E7/E9/F, which turned
# CI red on code nobody had touched (30 findings across I, RUF, PIE, BLE, DTZ,
# EXE, FURB and UP). Naming the set here means a ruff upgrade can no longer
# change what CI enforces on its own. Adopting more rules is a deliberate edit.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
